name: smart_fitness_dashboard
description: quant — local nutrition, activity and body progress for Android.
publish_to: 'none'
version: 1.4.7+12

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_local_notifications: 19.5.0
  timezone: 0.10.1
  flutter_timezone: 4.1.1
  mobile_scanner: 6.0.11
  health: 12.2.0
  local_auth: 2.3.0
  permission_handler: 11.3.1
  # Dart 3 compatible continuation of isar / isar_flutter_libs.
  isar_community: 3.4.1
  isar_community_flutter_libs: 3.4.1
  path_provider: 2.1.4
  fl_chart: 0.69.2
  intl: 0.20.2
  google_fonts: 6.2.1
  shared_preferences: 2.2.3
  # Native implementations pinned to the validated Android 35 / Java 17 stack.
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.15

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  isar_community_generator: 3.4.1
  build_runner: 2.10.5

flutter:
  uses-material-design: true
  assets:
    - assets/data/ru_base_foods.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
