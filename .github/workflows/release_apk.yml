name: quant release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Restore persistent Android signing
        if: github.event_name != 'pull_request'
        env:
          QUANT_KEYSTORE_BASE64: ${{ secrets.QUANT_KEYSTORE_BASE64 }}
          QUANT_KEYSTORE_PASSWORD: ${{ secrets.QUANT_KEYSTORE_PASSWORD }}
          QUANT_KEY_PASSWORD: ${{ secrets.QUANT_KEY_PASSWORD }}
        run: python3 .github/scripts/restore_signing.py
      - name: Security regression and dependency advisory checks
        run: |
          dart pub deps --json > .dart_tool/dependency-tree.json
          node tool/security_check.mjs --advisories
      - name: Generate Isar schemas
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Release APK
        run: flutter build apk --release
      - name: Verify packaged Android permissions and flags
        run: node tool/check_apk.mjs
      - name: Verify persistent signing certificate
        if: github.event_name != 'pull_request'
        run: node tool/check_signing.mjs
      - name: Rename quant APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/quant-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quant-release
          path: build/app/outputs/flutter-apk/quant-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing material
        if: always()
        run: rm -f android/key.properties android/app/quant-release-key.jks
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  android-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - run: flutter pub get
      - name: Restore persistent Android signing
        if: github.event_name != 'pull_request'
        env:
          QUANT_KEYSTORE_BASE64: ${{ secrets.QUANT_KEYSTORE_BASE64 }}
          QUANT_KEYSTORE_PASSWORD: ${{ secrets.QUANT_KEYSTORE_PASSWORD }}
          QUANT_KEY_PASSWORD: ${{ secrets.QUANT_KEY_PASSWORD }}
        run: python3 .github/scripts/restore_signing.py
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Configure integration build memory
        run: |
          sed -i 's/-Xmx2G/-Xmx4G/' android/gradle.properties
      - name: Run Android database and navigation integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test -d emulator-5554
      - name: Verify debug certificate matches release
        if: github.event_name != 'pull_request'
        run: node tool/check_signing.mjs build/app/outputs/flutter-apk/app-debug.apk
      - name: Remove private signing material
        if: always()
        run: rm -f android/key.properties android/app/quant-release-key.jks

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quant-release
          path: release
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${{ github.run_number }}" release/quant-release.apk --target "${{ github.sha }}" --title "quant · build ${{ github.run_number }}" --notes "Automated quant APK with the persistent private quant signing certificate. Analyze, unit/widget tests, security regression and certificate checks passed. Emulator results are reported separately in Actions."
